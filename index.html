<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://gstatic.com" crossorigin>

rel="stylesheet">

<style>
:root {
    --gold: #c4a574;
    --gold-dark: #9e7c47;
    --gold-light: #e9dcc5;
    --cream: #faf8f4;
    --white: #ffffff;
    --text: #49443d;
    --muted: #817a70;
    --green: #25d366;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 90px;
}

body {
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    background: var(--white);
    line-height: 1.7;
}

h1, h2, h3 {
    font-family: 'Playfair Display', serif;
    font-weight: 500;
    line-height: 1.2;
}

a {
    text-decoration: none;
    color: inherit;
}

button {
    font-family: inherit;
}

.container {
    width: min(1120px, 90%);
    margin: auto;
}

.section {
    padding: 100px 0;
}

.section-title {
    text-align: center;
    max-width: 680px;
    margin: 0 auto 45px;
}

.section-title h2 {
    font-size: clamp(2rem, 4vw, 3.1rem);
    margin: 12px 0 18px;
}

.section-title p {
    color: var(--muted);
}

.eyebrow {
    color: var(--gold-dark);
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: .75rem;
    font-weight: 700;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px 25px;
    border-radius: 3px;
    border: 1px solid var(--gold);
    background: var(--gold);
    color: #fff;
    font-size: .88rem;
    font-weight: 700;
    letter-spacing: .3px;
    transition: .3s;
    cursor: pointer;
}

.btn:hover {
    background: var(--gold-dark);
    border-color: var(--gold-dark);
    transform: translateY(-2px);
}

.btn-outline {
    background: transparent;
    color: var(--gold-dark);
}

.btn-outline:hover {
    color: white;
}

.topbar {
    background: #f1e8d9;
    text-align: center;
    padding: 9px 15px;
    font-size: .78rem;
    letter-spacing: .4px;
}

header {
    height: 82px;
    background: rgba(255,255,255,.97);
    display: flex;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid #f0ece5;
}

.nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-family: 'Playfair Display', serif;
    color: var(--gold-dark);
    font-size: 1.55rem;
    line-height: 1.15;
}

.logo small {
    display: block;
    font-family: 'DM Sans', sans-serif;
    color: var(--muted);
    font-size: .62rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-top: 5px;
}

.nav-links {
    display: flex;
    gap: 28px;
    align-items: center;
    font-size: .84rem;
}

.nav-links a:not(.btn):hover {
    color: var(--gold-dark);
}

.menu-toggle {
    display: none;
    border: 0;
    background: none;
    font-size: 1.8rem;
    cursor: pointer;
    color: var(--gold-dark);
}

/* BANNER */
.hero {
    min-height: 640px;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(
            90deg,
            rgba(250,248,244,.98) 0%,
            rgba(250,248,244,.92) 43%,
            rgba(250,248,244,.12) 100%
        ),
        url('https://screenshotbot.com') center 35% / cover no-repeat;
}

.hero-content {
    max-width: 590px;
    padding: 85px 0;
}

.hero-label {
    display: inline-block;
    border: 1px solid var(--gold-light);
    color: var(--gold-dark);
    padding: 7px 14px;
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 25px;
    background: rgba(255,255,255,.6);
}

.hero h1 {
    font-size: clamp(3rem, 6vw, 5.5rem);
    color: #494238;
    margin-bottom: 22px;
    letter-spacing: -1.5px;
}

.hero h1 span {
    color: var(--gold-dark);
    font-style: italic;
}

.hero p {
    max-width: 470px;
    color: #696157;
    font-size: 1.02rem;
    margin-bottom: 30px;
}

.hero-buttons {
    display: flex;
    gap: 13px;
    flex-wrap: wrap;
}

.hero-note {
    margin-top: 25px;
    font-size: .78rem;
    color: var(--muted);
}

/* FAIXA */
.info-strip {
    background: var(--white);
    border-bottom: 1px solid #f0ece5;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding: 28px 0;
    gap: 20px;
}

.info-item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
}

.info-icon {
    width: 43px;
    height: 43px;
    border: 1px solid var(--gold-light);
    display: grid;
    place-items: center;
    color: var(--gold-dark);
    font-size: 1.2rem;
    flex-shrink: 0;
}

.info-item strong {
    display: block;
    font-size: .87rem;
}

.info-item span {
    font-size: .78rem;
    color: var(--muted);
}

/* SOBRE */
.about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 75px;
    align-items: center;
}

.about-image {
    min-height: 580px;
    position: relative;
    background: url('https://screenshotbot.com') center / cover no-repeat;
}

.image-caption {
    position: absolute;
    bottom: -20px;
    right: -20px;
    background: white;
    border: 1px solid var(--gold-light);
    padding: 22px;
    max-width: 230px;
    box-shadow: 0 10px 30px #0000000a;
}

.image-caption strong {
    display: block;
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    color: var(--gold-dark);
}

.image-caption span {
    font-size: .78rem;
    color: var(--muted);
}

.about-text h2 {
    font-size: clamp(2.2rem, 4vw, 3.3rem);
    margin: 14px 0 23px;
}

.about-text p {
    color: var(--muted);
    margin-bottom: 18px;
}

.check-list {
    list-style: none;
    margin: 25px 0 30px;
}

.check-list li {
    margin-bottom: 12px;
    display: flex;
    gap: 12px;
    font-size: .92rem;
}

.check-list li::before {
    content: '✓';
    color: var(--gold-dark);
    font-weight: 700;
}

/* BENEFÍCIOS */
.benefits {
    background: var(--cream);
}

.benefit-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.benefit-card {
    background: white;
    padding: 35px 28px;
    border: 1px solid #eee8de;
    transition: .3s;
}

.benefit-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px #00000008;
}

.benefit-icon {
    font-size: 1.8rem;
    margin-bottom: 20px;
}

.benefit-card h3 {
    font-size: 1.35rem;
    margin-bottom: 13px;
}

.benefit-card p {
    font-size: .9rem;
    color: var(--muted);
}

/* EVENTO */
.event {
    background: #fff;
    padding-bottom: 50px;
}

.event-card {
    background: var(--cream);
    border: 1px solid var(--gold-light);
    display: grid;
    grid-template-columns: .85fr 1.15fr;
}

.event-date {
    background: #f0e5d3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 25px;
    text-align: center;
}

.event-date .month {
    text-transform: uppercase;
    letter-spacing: 4px;
    color: var(--gold-dark);
    font-size: .9rem;
}

.event-date .day {
    font-family: 'Playfair Display', serif;
    font-size: 7rem;
    line-height: 1.1;
    color: #7f643e;
}

.event-date .year {
    letter-spacing: 2px;
    font-size: .9rem;
}

.event-details {
    padding: 55px;
}

.event-details h3 {
    font-size: 2rem;
    margin: 12px 0 25px;
}

.event-detail {
    display: flex;
    gap: 15px;
    margin: 20px 0;
}

.event-detail .symbol {
    font-size: 1.3rem;
    color: var(--gold-dark);
}

.event-detail strong {
    display: block;
    font-size: .9rem;
}

/* INVESTIMENTO / PREÇOS */
.pricing {
    background: var(--cream);
    padding: 100px 0;
}

.pricing-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 30px;
    max-width: 900px;
    margin: 0 auto;
}

.price-card {
    background: var(--white);
    border: 1px solid #eee8de;
    padding: 40px 30px;
    text-align: center;
    position: relative;
    transition: .3s;
}

.price-card.featured {
    border: 2px solid var(--gold);
    transform: scale(1.03);
}

.badge {
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--gold);
    color: var(--white);
    padding: 5px 15px;
    font-size: .75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.price-card h3 {
    font-size: 1.6rem;
    margin-bottom: 15px;
}

.price-card p {
    color: var(--muted);
    font-size: .9rem;
    margin-bottom: 25px;
}

.price-value {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    color: var(--gold-dark);
    font-weight: 600;
    margin-bottom: 30px;
}

.price-value span {
    font-size: 1.2rem;
    font-family: 'DM Sans', sans-serif;
}
</style>
</head>
<body>

    <div class="topbar">VAGAS LIMITADAS PARA O DIA DO EVENTO — AGENDE SEU HORÁRIO</div>

    <header>
        <div class="container nav">
            <div class="logo">
                A&L ESTÉTICA
                <small>Estética Avançada</small>
            </div>
            <nav class="nav-links">
                <a href="#sobre">Sobre</a>
                <a href="#beneficios">Benefícios</a>
                <a href="#evento">O Evento</a>
                <a href="#precos">Valores</a>
                <a href="https://wa.me" class="btn">Agendar via WhatsApp</a>
            </nav>
        </div>
    </header>

    <!-- BANNER PRINCIPAL (HERO) -->
    <section class="hero">
